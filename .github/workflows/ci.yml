name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint with ruff (check)
        run: uv run ruff check .
      - name: Lint with ruff (format)
        run: uv run ruff format --check .
      - name: Type check with mypy
        run: uv run mypy dlv-core dlv-api dlv-app
      - name: Test with pytest
        run: uv run pytest -q

      # F1-35: el `.spec` de PyInstaller (empaquetado `onedir` de dlv-app,
      # ADR-002) no se ejecuta en CI. PyInstaller ya es dependencia de
      # desarrollo, así que el motivo ya no es ese: es que generar el paquete
      # real y medirlo (arranque en frío y tamaño contra
      # docs/02-alcance-y-plan.md §2.6) es trabajo de F5-01, y hacerlo en cada
      # push costaría varios minutos por plataforma para comprobar algo que
      # todavía no tiene presupuesto exigible. Esta comprobación es
      # deliberadamente barata: solo confirma que el fichero sigue siendo
      # Python sintácticamente válido, para detectar una errata antes de F5-01.
      - name: Sintaxis del .spec de PyInstaller (dlv-app)
        run: uv run python -m py_compile dlv-app/dlv_app.spec

      # --- Puertas de presupuesto (F0-04) --------------------------------- #
      # ADR-009: ningún bucle por muestra en Python dentro de dlv-core.
      # Es inspección estática, así que corre en las tres plataformas.
      - name: ADR-009 (sin bucles por muestra)
        run: uv run python tools/banco.py adr009

      # `comprobar` solo falla con INCUMPLE: los presupuestos cuya
      # funcionalidad aún no existe quedan NO_MEDIBLE y no rompen nada.
      - name: Puertas de presupuesto
        run: uv run python tools/banco.py comprobar

  rendimiento:
    name: Banco de rendimiento
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages

      # El log de 1 h (~70 MB) se genera, no se versiona.
      - name: Generar corpus sintético
        run: uv run python tools/generar_corpus.py autolog-1h

      - name: Línea base sin dependencias
        run: uv run python tools/banco.py baseline-stdlib

      # F0-01: la medición que confirma o refuta el presupuesto de apertura
      # y, con él, la viabilidad de la base Python (riesgo R9).
      - name: Spike de Polars
        run: uv run python tools/banco.py spike-polars

      - name: Caché Parquet (segunda apertura)
        run: uv run python tools/banco.py cache

      - name: Informe
        run: uv run python tools/banco.py informe

      - name: Puertas de presupuesto
        run: uv run python tools/banco.py comprobar

      - name: Publicar mediciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banco-rendimiento
          path: state/banco/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dlv-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dlv-ui
      - name: Build
        run: npm run build
        working-directory: dlv-ui

      # F1-37. Sin estas dos líneas, `dlv-ui` solo compilaba en CI: las pruebas
      # y los bancos existían y no los ejecutaba nadie, que es la misma
      # situación que no tenerlos.
      - name: Test
        run: npm test
        working-directory: dlv-ui

      # Bancos de CPU de F1-23 y F1-24. Miden la MITAD de los presupuestos de
      # §2.6 que no necesita GPU —el trabajo de JavaScript por fotograma y el
      # coste de buscar el valor del cursor— y fallan si se pasan. La otra
      # mitad (fps reales, coste del DOM) necesita navegador con GPU y NO se
      # mide aquí: un navegador sin cabeza mediría su renderizador por
      # software y daría un número tranquilizador y falso. Se mide abriendo
      # `dlv-ui/banco-fps.html`, y hasta que alguien lo abra ese presupuesto
      # está NO MEDIDO, que no es lo mismo que verde (docs/08 §8.10).
      - name: Bancos de CPU del frontend
        run: npm run banco
        working-directory: dlv-ui

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlv-ui-dist
          path: dlv-ui/dist
