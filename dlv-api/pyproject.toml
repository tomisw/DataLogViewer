[project]
name = "dlv-api"
version = "0.1.0"
description = "Capa de comandos de DataLogViewer (ADR-007): FastAPI + uvicorn sobre 127.0.0.1, puerto efímero y token de sesión generado al arrancar. Depende de dlv-core."
requires-python = ">=3.12"
dependencies = [
    "dlv-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlv_api"]

[tool.uv.sources]
dlv-core = { workspace = true }
