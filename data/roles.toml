# --------------------------------------------------------------------------- #
#  GANANCIAS DE LOS LAZOS PID, y por que estan aqui
#  ==================================================
#  Estos roles NO se anadieron por completar un perfil, sino para APAGAR dos
#  falsos positivos que creo la ampliacion de arriba. Con `idle_trim_largo` y
#  `boost_trim_largo` recien dados de alta, el emparejamiento difuso empezo a
#  asignar:
#
#      «Idle Control Long Term Trim Gain»  -> idle_trim_largo   (parecido 0,920)
#      «Boost Control Long Term Trim Gain» -> boost_trim_largo  (parecido 0,923)
#
#  Y son cosas distintas: el TRIM es cuanto esta corrigiendo el lazo ahora
#  mismo; la GANANCIA es el coeficiente con el que reacciona. Confundirlos pone
#  un coeficiente de sintonia en el panel donde se lee una correccion, con el
#  mismo aspecto de correcto. Es exactamente el fallo que `docs/07` §7.15
#  describe para el emparejamiento difuso, y la razon de que una coincidencia
#  DIFUSA no pueda activar un detector critico sin confirmar.
#
#  Con rol propio, esos canales pasan a EXACTA y dejan de robarle el rol al
#  trim. La leccion, anotada: cada rol nuevo cambia el vecindario del difuso, y
#  hay que volver a mirar las DIFUSAS despues de ampliar el catalogo.
#
#  Las dimensiones (`pct_per_kPa`, `pct_per_rpm`, `pct_per_lambda`) son
#  compuestas y ya existen en `data/units.toml`.
# --------------------------------------------------------------------------- #
[roles.boost_gain_proporcional]
dimension = "pct_per_kPa"
plausible = { min = -10000.0, max = 10000.0 }     # %/kPa (medido 0..784)
sinonimos = ["Boost Control Proportional Gain", "Boost Proportional Gain"]

[roles.boost_gain_integral]
dimension = "pct_per_kPa"
plausible = { min = -10000.0, max = 10000.0 }     # %/kPa (medido 0..1310)
sinonimos = ["Boost Control Integral Gain", "Boost Integral Gain"]

[roles.boost_gain_derivativo]
dimension = "pct_per_kPa"
plausible = { min = -10000.0, max = 10000.0 }     # %/kPa (medido 0..98)
sinonimos = ["Boost Control Derivative Gain", "Boost Derivative Gain"]

[roles.boost_gain_trim_largo]
dimension = "unknown"
plausible = { min = -10000.0, max = 10000.0 }     # crudo
sinonimos = ["Boost Control Long Term Trim Gain"]

[roles.boost_gain_trim_corto]
dimension = "unknown"
plausible = { min = -10000.0, max = 10000.0 }     # crudo
sinonimos = ["Boost Control Short Term Trim Gain"]

[roles.idle_gain_proporcional]
dimension = "pct_per_rpm"
plausible = { min = -10000.0, max = 10000.0 }     # %/rpm
sinonimos = ["Idle Control Proportional Gain", "Idle Proportional Gain"]

[roles.idle_gain_integral]
dimension = "pct_per_rpm"
plausible = { min = -10000.0, max = 10000.0 }     # %/rpm (medido 0..500)
sinonimos = ["Idle Control Integral Gain", "Idle Integral Gain"]

[roles.idle_gain_derivativo]
dimension = "pct_per_rpm"
plausible = { min = -10000.0, max = 10000.0 }     # %/rpm
sinonimos = ["Idle Control Derivative Gain", "Idle Derivative Gain"]

[roles.idle_gain_trim_largo]
dimension = "unknown"
plausible = { min = -10000.0, max = 10000.0 }     # crudo
sinonimos = ["Idle Control Long Term Trim Gain"]

[roles.idle_gain_trim_corto]
dimension = "unknown"
plausible = { min = -10000.0, max = 10000.0 }     # crudo
sinonimos = ["Idle Control Short Term Trim Gain"]

[roles.o2_gain_proporcional]
dimension = "pct_per_lambda"
plausible = { min = -10000.0, max = 10000.0 }     # %/lambda (medido 73..304)
sinonimos = ["O2 Control Proportional Gain"]

[roles.o2_gain_integral]
dimension = "pct_per_lambda"
plausible = { min = -10000.0, max = 10000.0 }     # %/lambda (medido 91..383)
sinonimos = ["O2 Control Integral Gain"]

# --------------------------------------------------------------------------- #
#  Los dos ultimos falsos positivos que quedaban, con la misma cura.
#  «Base Output» no es «Output» (uno es el punto de partida del lazo, el otro
#  su salida efectiva), y «Target Offset Pressure» no es «Target Pressure»
#  (uno es un desplazamiento, el otro el objetivo).
# --------------------------------------------------------------------------- #
[roles.idle_output_base]
dimension = "ratio"
plausible = { min = -1.0, max = 2.0 }             # fraccion
sinonimos = ["Idle Control Base Output", "Idle Base Output"]

[roles.boost_pressure_target_offset]
dimension = "pressure"
plausible = { min = -1000.0, max = 1000.0 }       # kPa
sinonimos = ["Boost Control Target Offset Pressure"]

[roles.air_mass_flow_max]
dimension = "unknown"
plausible = { min = -1.0e9, max = 1.0e9 }         # escala sin confirmar
sinonimos = ["Max Mass Air Flow"]

[roles.o2_gain_derivativo]
dimension = "pct_per_lambda"
plausible = { min = -10000.0, max = 10000.0 }     # %/lambda
# Sin este rol, «O2 Control Derivative Gain» caia en difuso contra
# `boost_gain_derivativo` con parecido 0,898: la ganancia del lazo de mezcla
# atribuida al de soplado. Tercera vez que ampliar el catalogo desplaza una
# coincidencia difusa a un vecino equivocado; hay que remirarlas SIEMPRE.
sinonimos = ["O2 Control Derivative Gain"]
