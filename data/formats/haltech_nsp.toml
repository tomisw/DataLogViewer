[resumen]
tipos_totales = 34
# F1-47 pasó `Flow`, `InjFuelVolume` y `MassPerCyl` de inferidos a confirmados
# con la especificación del inyector del propietario: 16 -> 19 y 11 -> 8.
# F1-38 pasó `MassOverTime` (5 canales) y `AngularVelocity` (1) de desconocidos a
# confirmados, midiendo sobre las 2 636 filas del AutoLog: 19 -> 21 y 7 -> 5.
confirmados = 21
inferidos = 8
desconocidos = 5
canales_totales = 475
# CORRECCIÓN DE RECUENTO, encontrada al hacer F1-38. Estos tres números no
# cuadraban con la suma de los `canales` de cada tipo, y llevaban así desde
# F1-47: esa tarea cambió la confianza de `Flow` (2 canales), `InjFuelVolume`
# (13) y `MassPerCyl` (3) de inferida a confirmada, pero dejó los 18 canales
# contados como inferidos. Decía 422 y 36 donde la suma daba 440 y 18.
# Ahora los tres son la suma real, y `test_descriptor_haltech.py` la comprueba
# para que no vuelva a desviarse en silencio.
canales_confirmados = 446
canales_inferidos = 18
canales_desconocidos = 11
# Matiz importante para no leer el 446 como mejor de lo que es: incluye los 102
# canales de tipo `Raw`, cuya escala es trivialmente x1 pero que NO tienen unidad
# física (son contadores, enumerados y máscaras). Canales con una unidad física
# confirmada: 446 - 102 = 344 de 475, el 72 %.
canales_con_unidad_fisica_confirmada = 344
# Y un segundo matiz, que F1-38 obliga a escribir: de esos 326, cuatro —los de
# Mass Air Flow— tienen la unidad confirmada y el VALOR no fiable en absoluto.
# La unidad de un canal y su credibilidad son dos cosas distintas; ver la
# evidencia de `MassOverTime`.
canales_con_unidad_confirmada_y_valor_no_fiable = 4
nota = """
Frente a las 13 escalas confirmadas de docs/01 §1.8, esta revisión confirma tres
más por identidad aritmética sobre la fila de referencia:
  · AbsPressure  — resulta ser la presión RELATIVA, no la absoluta.
  · Frequency    — x1 Hz, vía el disparo del inyector.
  · Time_us      — x1 µs, vía el periodo de ciclo del motor (y de paso revela
                   que el motor tiene 6 cilindros).
F1-38 cerró dos de los desconocidos y dejó los otros cinco con la evidencia
corregida: dos de ellos —`FuelVolume` y `PulsesPerLongDistance`— se habían
descartado juzgando UNA fila, y sobre el log completo los dos canales varían.
Siguen sin factor, pero ahora se sabe qué son y qué dato falta para fijarlos.
Los 5 desconocidos y los 8 inferidos que quedan no se rellenan a ojo: se muestran
en crudo o con marca, según su confianza."""
