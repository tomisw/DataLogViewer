# =========================================================================== #
#  DESCONOCIDOS — no deducibles con las muestras disponibles.
#  Se muestran EN CRUDO, sin unidad y con el selector desactivado.
#  Es la mitigación del riesgo R1: mejor sin unidad que con una inventada.
# =========================================================================== #

[tipos.FuelVolume]
dimension = "unknown"
a_canonica = 1.0
confianza = "unknown"
evidencia = """
SIGUE SIN FIJAR, pero la nota anterior era FALSA y hay que corregirla: decia
«crudo 0 en la fila de referencia, sin ningun valor distinto de cero con el que
deducir la escala». Sobre el AutoLog completo el canal tiene 1 552 filas no nulas
de 2 636, con 459 valores distintos, y recorre -9 724 .. +5 344. Lo que fallaba
era el metodo, no el canal: se juzgo por una fila.

QUE ES. `Transient Throttle Fuel Peak Synchronous Output` es el aporte de
combustible del enriquecimiento transitorio, y el signo importa: 1 356 filas
positivas (enriquecimiento al abrir gas) y 196 negativas (empobrecimiento al
cerrar). Es un INCREMENTO sobre el combustible base, no una cantidad absoluta,
asi que su clase de magnitud es INTERVALO. Da igual para el numero —el volumen no
tiene origen desplazado— pero no da igual para lo que significa.

POR QUE AUN ASI NO SE PUEDE FIJAR. Ningun canal del log publica esta misma
cantidad en unidades ya conocidas, que es lo que resolvio `MassOverTime`. Se
probaron los candidatos y ninguno da una relacion constante:

  contra Transient Throttle Fuel Enrichment Sync Amount (%):  cv 96 %
  contra Injector 1 Volume:                        correlacion -0,23
  contra Throttle Position Derivative:             correlacion +0,43
  contra Transient Throttle Fuel Enrichment Rate:  correlacion +0,58

Correlaciones de 0,4 a 0,6 dicen que el canal tiene que ver con el transitorio,
que ya se sabia por el nombre; no fijan una escala.

LO QUE SI SE PUEDE ACOTAR, y es la via si esto se retoma: si compartiese unidad
con `InjFuelVolume` (decenas de nanolitros, confirmado en F1-47), el maximo de
5 344 serian 53 uL, frente a los 119 uL que el inyector entrega por ciclo a plena
carga —un aporte transitorio de pico del 45 %, que es del orden de lo que se
configura—. Es PLAUSIBLE y por eso no se escribe: exactamente el paso que la
regla de `confianza = unknown` prohibe. Haria falta una identidad, y la unica que
la cerraria es comparar el volumen inyectado durante un transitorio con el mismo
punto en regimen estacionario, que necesita un log grabado a proposito."""
canales = 1

[tipos.PulsesPerLongDistance]
dimension = "unknown"
a_canonica = 1.0
confianza = "unknown"
evidencia = """
SIGUE SIN FIJAR, y aqui tambien la nota anterior era FALSA en lo esencial: decia
que `Vehicle Speed 0 Calculated Rate` es «un parametro de calibracion del sensor
de velocidad, no una medida». Es una medida. Sobre el AutoLog recorre 0 .. 3 793
con 601 valores distintos, y:

  correlacion(tasa, Vehicle Speed) = +0,99998
  tasa / crudo(Vehicle Speed) = 4,0824,  cv 0,44 %  sobre 1 338 filas

Es la frecuencia de pulsos del sensor de velocidad, proporcional a la velocidad
como tiene que ser. Un parametro de calibracion habria sido constante, como
`Injection Stage 1 Flow Rate`, y no lo es.

POR QUE NO BASTA PARA FIJAR EL FACTOR. La proporcionalidad da la relacion entre
DOS canales, no la unidad de este. Con `Speed` a 0,1 km/h por cuenta —la fila mas
rapida del log es crudo 929, o sea 92,9 km/h— salen 40,82 cuentas por km/h, y de
ahi la unidad depende de un dato que el log no publica, los pulsos por kilometro
configurados en la ECU:

  si la tasa esta en Hz:          146 967 pulsos/km
  si esta en pulsos por minuto:     2 449 pulsos/km

El primero son demasiados pulsos para un sensor de velocidad; el segundo es del
orden de lo normal. Eso es plausibilidad, no evidencia, y no se escribe.

LA PREGUNTA CONCRETA QUE LO CIERRA, que es lo que esta tarea puede aportar: cual
es la calibracion del sensor de velocidad en la ECU (pulsos por km, o pulsos por
revolucion y el desarrollo de la rueda). Con ese numero el factor sale de una
division y este tipo pasa a confirmado. Sin el, no.

PISTA POR SI SE MIDE ALGUN DIA: contra `Driveshaft RPM` el cociente sale 7,93 con
cv 2,31 %, y en las cinco filas mas rapidas del log ronda 8,0. Ocho pulsos por
revolucion es un numero de sensor creible, pero el 2,31 % de dispersion no
aguanta como identidad."""
canales = 1

