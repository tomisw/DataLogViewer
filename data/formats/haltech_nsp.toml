[tipos.MassPerCyl]
dimension = "mass_per_cyl"
a_canonica = 1.0
confianza = "confirmed"
evidencia = """
EL FACTOR NO CAMBIA; pasa de inferido a confirmado en F1-47.

La relación entre los dos canales ya se sabía buena, pero un cociente es
invariante a la escala: multiplica los dos por diez y el AFR sale igual. Nunca
pudo fijar el factor absoluto, y la nota anterior lo decía.

Lo que lo fija es el volumen inyectado, una vez `InjFuelVolume` queda anclado
por la identidad del inyector. La densidad del combustible que sale de dividir
masa entre volumen es 0,741 g/mL sobre 744 filas, con desviación típica 0,007:
gasolina, en el centro de su rango. Con cualquier otro factor para este tipo la
densidad se iría a un múltiplo de diez de la de la gasolina, que ya no es un
combustible sino un metal.

SOBRE EL LLENADO VOLUMÉTRICO, que es lo que la nota anterior intentaba usar. El
motor es un RB26DETT: 2 568 cm³ entre 6 cilindros son 428 cm³/cilindro. En la
fila del máximo medido (213,0 kPa, 55,1 °C de temperatura de aire calculada,
6 449 rpm), los 1 065 mg de aire por cilindro dan un llenado del 110 % sobre la
densidad del colector. Es alto, y NO se usa como prueba: ese 110 % sale de una
temperatura de carga modelada que el propio log sesga con la del refrigerante
(`Calculated Air Temperature Coolant Temperature Bias`), y una temperatura
sobrestimada infla el llenado calculado. El argumento bueno es el de la
densidad del combustible; este solo sirve para ver que no hay un factor 10 de
por medio, y no lo hay.

La nota anterior calculaba un 78 % con 0,5 L/cilindro y sobre la FILA DE
REFERENCIA en vez del máximo. Ni la cilindrada ni la fila eran las correctas."""
canales = 3

[tipos.ShortDistance]
dimension = "distance"
a_canonica = 0.1
confianza = "inferred"
evidencia = """
Distance Traveled - Current Run Cycle llega a 14133 -> 1 413,3 m en el ciclo.
Con x1 saldrían 14,1 km, que en los 245,1 s del log exigirían 207,6 km/h de
media; el MÁXIMO instantáneo del canal de velocidad es 92,9 km/h, así que x1 es
