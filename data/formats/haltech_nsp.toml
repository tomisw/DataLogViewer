Corregido en FG-10 midiendo el log: la versión anterior de esta nota usaba el
valor de la fila de referencia (8692) como si fuera el máximo, y citaba «máximo
52,7 km/h», que es el valor de la FILA DE REFERENCIA del canal de velocidad
(crudo 527) y no el máximo del log. La conclusión no cambia; los números sí, y
un número mal citado en una evidencia es lo que hace que la puerta G1 no se
pueda revisar.
AVISO: el argumento de DisplayMaxMin es más débil de lo que parece. DMM 10000,0
sugiere 1 km como techo, coherente con /10, pero el canal alcanza 14133 en crudo:
se sale de su propio rango de presentación por 1,41x. Un DMM que el canal excede
no acota la escala."""
