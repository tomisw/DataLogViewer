#  Descriptor del formato Haltech NSP  ·  %DataLog% 1.1
#
#  Tarea F0-09.  Especificación: docs/01-formato-log.md
#  PUERTA G1: estos factores llegan a decisiones de tuning. No se cambia una
#  entrada sin que una persona lea el diff.
#
#  Este fichero mapea los 34 valores de `Type` del formato a la DIMENSIÓN y la
#  ESCALA DE ORIGEN hacia la unidad canónica de esa dimensión.  Las dimensiones
#  y sus unidades canónicas están en data/units.toml (F0-08, aprobado).
#
#      entero crudo --a_canonica--> VALOR CANÓNICO --units.toml--> mostrado
#
#  `a_canonica` es un factor multiplicativo: canonica = crudo * a.
#  Ningún tipo de este formato necesita desplazamiento en el origen: la
#  temperatura viene en deciKelvin y la canónica es el kelvin, así que el
#  −273,15 vive en units.toml (conversión de presentación), no aquí.
#  Es la razón de que el modelo tenga tres capas y no dos.
#
#  `confianza`:
#      confirmed  identidad aritmética o rango inequívoco. Se puede mostrar.
#      inferred   físicamente plausible pero sin prueba. Se muestra con marca.
#      unknown    no deducible con las muestras disponibles. Se muestra EN CRUDO,
#                 sin unidad y con el selector desactivado (mitigación de R1).
#
#  Los `unknown` son el trabajo de la tarea F1-38.  No se rellenan a ojo.

[meta]
formato = "haltech_nsp"
version_datalog = "1.1"
firma = "%DataLog%"
software = "Haltech NSP"
tarea = "F0-09"
especificacion = "docs/01-formato-log.md"
# Evidencia: los tres logs de samples/real/. La fila de referencia usada para
# las identidades es la de MAP máximo del AutoLog: 6715 rpm, MAP 2272 (227,2 kPa
# absolutos), TPS 563 (56,3 %).
fila_de_referencia = "AutoLog_20260729_1830.csv, MAP máximo"

[deteccion]
# La primera línea es la firma; DataLogVersion gobierna la compatibilidad.
# Una versión mayor desconocida se RECHAZA con error claro (docs/01 §1.1).
primera_linea = "%DataLog%"
version_soportada = ["1.1"]
finales_de_linea = "CRLF nativo; también se acepta LF (docs/01 §1.13)"
# FG-13: el NOMBRE de la clave de versión es del formato, no del motor. Hasta
# FG-13 estaba cableado en `formatos/haltech.py`, que citaba «DataLogVersion»
# literalmente en dos sitios. Un formato sin línea de versión omite esta clave.
clave_version = "DataLogVersion"

[cabecera]
# Bloques Channel/ID/Type/DisplayMaxMin; DisplayMaxMin es OPCIONAL (13 de los
# 475 canales del AutoLog no la tienen) y su ausencia no debe desalinear.
clave_canal = "Channel"
claves_bloque = ["ID", "Type", "DisplayMaxMin"]
claves_opcionales = ["DisplayMaxMin"]
metadatos_cierre = ["Log Source", "Log Number", "Log"]
# La identidad del canal es el ID, nunca el nombre (docs/01 §1.3).
identidad = "ID"

# --- Lo que FG-13 sube del código al descriptor ---------------------------- #
#  Todo lo de aquí abajo estaba cableado en `formatos/haltech.py` antes de
#  FG-13. Cada entrada pasa el criterio de la frontera: otro fabricante lo haría
#  de otra manera. Los VALORES no cambian —es un refactor, no un cambio de
#  comportamiento—; lo que cambia es dónde viven.

# `Clave : Valor`. El parser hacía `texto.partition(":")`. Se escribe sin los
# espacios de alrededor a propósito: el motor recorta los extremos, y un formato
# que separe con `=` no debería tener que declarar `" = "` con sus espacios.
separador_clave_valor = ":"

# Qué clave de bloque dice el TIPO del canal, que es lo que resuelve la
# dimensión y el factor de escala en [tipos]. Adivinarla («será `Type`») es el
# fallo más caro que puede tener un descriptor: produce canales con la escala
# equivocada y un fichero que parece haberse leído bien. Por eso el motor la
# exige y no tiene valor por omisión.
clave_tipo = "Type"

# El rango declarado por la ECU para el canal. Es `máximo,mínimo` —en ese orden,
# que es el contrario del que cualquiera escribiría— y es la evidencia con la que
# se confirmaron los factores de escala de [tipos]: «DisplayMaxMin 4731,2331 =
# 473,1 K (200 °C) / 233,1 K (−40 °C)». Si el orden se declarase al revés, todos
# los rangos saldrían invertidos sin que nada fallase.
clave_rango = "DisplayMaxMin"
rango_separador = ","
rango_orden = ["max", "min"]

# =========================================================================== #
#  CUERPO  (FG-13 · docs/01 §1.2 y §1.6)
# =========================================================================== #
#  Cómo se reconoce y se parte una fila de datos. La mecánica de leer un CSV
#  disperso multi-tasa NO está aquí porque no es del formato: los grupos de
#  muestreo salen del patrón de nulos (20/10/5 Hz entrelazados), y eso lo hacen
#  `almacen.py` y `grupos_muestreo.py` igual para cualquier fabricante.
[cuerpo]
delimitador = ","
# `HH:MM:SS.mmm`, hora del día en 24 h. El vocabulario es el de `ClaseDeTiempo`
# (FG-04); declararla es lo que permite que el motor RECHACE al cargar un
# descriptor cuya marca no sabe interpretar, en vez de aceptarlo y producir
# después un eje de tiempo inventado (docs/07 §7.5).
clase_de_tiempo = "hora_del_dia"
# Con qué forma empieza una fila de datos, y por tanto dónde acaba la cabecera.
# El parser llevaba este patrón compilado como `_RE_FILA`. El motor lo ancla al
# inicio y le añade el delimitador, así que aquí no se escriben ni `^` ni la
# coma final.
patron_marca = "\\d\\d:\\d\\d:\\d\\d\\.\\d\\d\\d"

# =========================================================================== #
#  RELOJ  (tarea F1-04 · docs/01 §1.4 y §1.5)
# =========================================================================== #
#  Los nombres de estas claves y las épocas de fábrica son propios del formato,
#  así que viven aquí y no en el código: otro fabricante sella la hora con otras
#  claves y otra época falsa, y añadirlo no debe tocar `dlv_core/reloj.py`.
[reloj]
# `Log : YYYYMMDD HH:MM:SS`. La FECHA es fiable; la HORA está en 12 h sin
# indicador AM/PM, mientras que las marcas de las filas están en 24 h
# (docs/01 §1.4). Por eso la hora del día se toma siempre de la primera fila y
# esta solo sirve para validar el desfase módulo 12 h.
clave_inicio = "Log"
hora_en_12h = true
# También en 12 h. Y está INVERTIDA respecto a `Log Number` en los dos logs
# internos de samples/real/ (06:59:01 para el 2768 y 06:59:00 para el 2769), así
# que no sirve para ordenar. Solo se usa como comprobación de coherencia.
clave_descarga = "DownloadDateTime"
# Monótono creciente. Es lo ÚNICO que ordena los logs internos.
clave_numero = "Log Number"
clave_origen = "Log Source"

# La ECU no tiene reloj de tiempo real: sella los logs internos con una fecha
# fija (docs/01 §1.5). `Log2768` y `Log2769` declaran los dos `19800101
# 01:01:01` y los dos empiezan en `01:01:01.005`, con lo que el desfase de la
# comprobación de 12 h sale 0 y la validación PASA. Es la razón de que la época
# se compruebe antes y por separado: un log sin tiempo absoluto que aparenta
# tenerlo es peor que uno que no lo declara.
epocas_ficticias = ["19800101", "19700101", "20000101", "20010101"]
# Red por debajo de la lista anterior, para épocas de fábrica no catalogadas.
fecha_minima_plausible = "20050101"
# Holgura de la comprobación de 12 h. En el AutoLog real el residuo es 0,506 s
# (cabecera 06:30:35, primera fila 18:30:35.506). Un minuto es mucho más que
# cualquier retardo plausible de escritura y muchísimo menos que las 12 h que
# esta comprobación tiene que distinguir, así que la holgura no puede dejar
# pasar un reloj de verdad equivocado.
tolerancia_desfase_s = 60.0

# =========================================================================== #
#  CONFIRMADOS — identidad aritmética o rango inequívoco
# =========================================================================== #

[tipos.EngineSpeed]
dimension = "angular_speed"
a_canonica = 1.0
confianza = "confirmed"
evidencia = "DisplayMaxMin 20000,0 = 20 000 rpm; crudo 6715 en tirada"
canales = 19

[tipos.Percentage]
dimension = "ratio"
# Canónica de `ratio` es la FRACCIÓN, no el porcentaje: 1000 crudo = 100 % = 1,0.
a_canonica = 0.001
confianza = "confirmed"
evidencia = "DisplayMaxMin 1000,0 = 100 %; Throttle Position 563 -> 56,3 %"
canales = 99

[tipos.Angle]
dimension = "angle"
a_canonica = 0.1
confianza = "confirmed"
evidencia = "DisplayMaxMin 600,-600 = ±60°; Ignition Angle 194 -> 19,4° de avance"
canales = 34

[tipos.Speed]
dimension = "speed"
a_canonica = 0.1
confianza = "confirmed"
evidencia = "DisplayMaxMin 4000,0 = 400 km/h; crudo 527 -> 52,7 km/h"
canales = 6

[tipos.Pressure]
dimension = "pressure"
a_canonica = 0.1
# ABSOLUTA. Pasar a relativa es cosa del modo de referencia de units.toml.
referencia = "absoluta"
confianza = "confirmed"
evidencia = """
DisplayMaxMin 6013,13 del colector = 601,3 / 1,3 kPa.
Manifold Pressure 326 -> 32,6 kPa (vacío de ralentí) y 2272 -> 227,2 kPa (boost).
Oil Pressure 2463 -> 246,3 kPa absolutos en ralentí."""
canales = 8

[tipos.AbsPressure]
dimension = "pressure"
a_canonica = 0.1
# TRAMPA DEL FORMATO: pese al nombre, este tipo NO es la presión absoluta.
# Contiene DIFERENCIAS de presión (diferenciales, errores, derivadas), que no
# tienen origen y por tanto NUNCA se les resta la presión de referencia.
# `Pressure` es la absoluta; `AbsPressure` es la relativa. Están invertidos
# respecto a lo que sugieren los nombres.
referencia = "ninguna"
clase = "intervalo"
confianza = "confirmed"
evidencia = """
Identidad exacta sobre la fila de referencia:
  Fuel Pressure Expected (5271, tipo Pressure)
  - Manifold Pressure    (2272, tipo Pressure)
  = 2999
  Injector Pressure Differential = 3000  (tipo AbsPressure)
Los otros tres canales del tipo son también diferencias:
Manifold Pressure Derivative, Boost Pressure Error, Boost Control Target Offset."""
canales = 4

[tipos.Temperature]
dimension = "temperature"
# deciKelvin -> kelvin. El −273,15 hacia °C está en units.toml, no aquí.
a_canonica = 0.1
confianza = "confirmed"
evidencia = """
DisplayMaxMin 4731,2331 = 473,1 K (200 °C) / 233,1 K (−40 °C).
Coolant Temperature 3663 -> 366,3 K = 93,15 °C con motor caliente.
Ver docs/01 §1.11: Oil Temperature está pegada en 2531 (−20 °C) en todo el
AutoLog con el motor a 93 °C -> sensor no instalado, no un fallo de escala."""
canales = 6

[tipos.BatteryVoltage]
dimension = "voltage"
a_canonica = 0.001
confianza = "confirmed"
evidencia = "DisplayMaxMin 18000,6500 = 18 / 6,5 V; crudo 12531 -> 12,531 V"
canales = 25

[tipos.AFR]
dimension = "mixture_ratio"
a_canonica = 0.001
# El tipo se llama AFR pero contiene LAMBDA. Pasar a AFR de verdad es una
# conversión parametrizada por el canal Stoichiometry (units.toml).
confianza = "confirmed"
evidencia = """
DisplayMaxMin 1361,476 = λ 1,361 / 0,476, rango imposible para un AFR.
Wideband O2 1 995 -> λ 0,995 en ralentí; 648 -> λ 0,648 a plena carga."""
canales = 12

[tipos.Stoichiometry]
dimension = "ratio"
# Adimensional: es la relación estequiométrica del combustible en uso.
a_canonica = 0.001
confianza = "confirmed"
evidencia = "Fuel Tuning Current Stoichiometry 14700 -> 14,7 (gasolina)"
canales = 1
# Este canal es el parámetro de la conversión λ -> AFR de units.toml.
rol_sugerido = "stoichiometry"

[tipos.Density]
dimension = "density"
a_canonica = 0.1
confianza = "confirmed"
evidencia = "Fuel - Primary Fuel Density 7372 -> 737,2 kg/m³ (gasolina). Max 10000,100 = 1000 / 10 kg/m³"
canales = 2

[tipos.Decibel]
dimension = "sound_level"
a_canonica = 0.01
confianza = "confirmed"
evidencia = """
DisplayMaxMin 6000,0 = 60 dB.
Knock Threshold 3400 -> 34 dB en ralentí y 5000 -> 50 dB a plena carga: el
umbral sube con la carga, que es el comportamiento correcto.
Knock Sensor 1 Knock Signal 903 -> 9,03 dB."""
canales = 7
# Escala logarítmica: units.toml la marca `convertible = false`.

[tipos.Time_us]
dimension = "time"
# microsegundos -> segundos
a_canonica = 0.000001
confianza = "confirmed"
evidencia = """
Identidad exacta sobre la fila de referencia (6715 rpm):
  Engine Cycle Period crudo = 17868
  teórico 2 vueltas = 2*60/6715 s = 17 870 µs   -> error 0,01 %
  Cylinder Period 2978; 17868/2978 = 6,0 -> confirma además 6 cilindros.
Injector 1 On Time 1748 -> 1,748 ms en ralentí."""
canales = 65

[tipos.Frequency]
dimension = "frequency"
a_canonica = 1.0
confianza = "confirmed"
evidencia = """
Injector 1 Frequency crudo = 55 a 6715 rpm.
Un inyector de 4 tiempos dispara una vez cada 2 vueltas: 6715/2/60 = 55,96 Hz.
DisplayMaxMin 20000,0 = 20 kHz."""
canales = 30

[tipos.ByteCount]
dimension = "count"
a_canonica = 1.0
confianza = "confirmed"
evidencia = """
Data Log Total Memory crudo = 8388608 = 2^23 exactamente = 8 MiB.
Es la memoria de log de la ECU, en bytes."""
canales = 2

[tipos.Raw]
dimension = "unknown"
a_canonica = 1.0
confianza = "confirmed"
# `Raw` no es una magnitud: son contadores, enumerados y máscaras de bits.
# La clasificación fina (enum vs máscara vs contador) es la tarea F0-11
# (data/enums.toml). Hasta entonces se muestran en crudo, que es lo correcto.
evidencia = """
102 canales. 75 de ellos tienen DisplayMaxMin con rango <= 20: son enumerados
o máscaras, no magnitudes continuas (docs/01 §1.10). Engine Protection Cause
llega a 65535 y es una MÁSCARA DE BITS: hay que decodificar bits, no valores."""
canales = 102
subtipos = "ver data/enums.toml (F0-11)"

[tipos.MassOverTime]
dimension = "mass_flow"
# centigramos por segundo -> kg/h  ==  0,01 g/s * 3,6
a_canonica = 0.036
confianza = "confirmed"
evidencia = """
RESUELTO EN F1-38. La nota anterior daba dos explicaciones posibles —que los
canales de Mass Air Flow no estuviesen conectados, o que la escala fuese otra— y
decia que no se podia distinguir con estas muestras. Se puede: LAS DOS SON
FALSAS, y medirlas sobre las 2 636 filas del AutoLog es lo que lo demuestra.

EL FACTOR, por identidad con un tipo ya confirmado. `Fuel Flow Estimated` es de
tipo `Flow` (0,06 L/h, confirmado en F1-47) y `Fuel Mass Flow` es de este tipo:
son el mismo caudal de combustible, uno en volumen y otro en masa, asi que su
cociente es la densidad del combustible y tiene que ser constante.

  crudo(Fuel Flow Estimated) / crudo(Fuel Mass Flow) = 0,813875
  sobre 1 364 filas, coeficiente de variacion 0,18 %

Un cociente constante al 0,18 % entre dos canales que la ECU calcula por caminos
distintos no es una coincidencia: son la misma magnitud. Y con el 0,06 de `Flow`
ya anclado por el inyector del propietario, ese cociente fija ESTE factor:

  factor = 0,06 L/h x 0,741 kg/L / 0,813875 = 0,036186 kg/h por cuenta
  medido fila a fila con caudal alto (>500 crudo, 879 filas): cv 0,04 %

0,036 exacto es la lectura natural del crudo —centigramos por segundo, porque
0,01 g/s x 3 600 s/h / 1 000 g/kg = 0,036 kg/h— y deja un 0,5 % de residuo, que
cae dentro de la incertidumbre de la propia densidad (0,741 +- 0,007 g/mL, o sea
0,9 %, medida en F1-47). Se adopta 0,036 y no 0,036186 porque el segundo numero
no es del formato: arrastra la densidad de ESTE deposito de gasolina.

TERCERA PATA, INDEPENDIENTE DE LA DENSIDAD Y DEL INYECTOR. `Fuel Mass Per
Cylinder` esta confirmado en mg/cilindro, y un cuatro tiempos de 6 cilindros
inyecta una vez por cilindro cada dos vueltas, asi que el caudal masico se puede
calcular sin usar ningun canal de caudal:

  mg/cil x 6 cil x (rpm/2) ciclos/min x 60 min/h / 1e6 = kg/h

Dividido por el crudo de `Fuel Mass Flow` da 0,0344 a 400 rpm y 0,0358 a
7 000 rpm: PLANO en todo el rango, con un 4 % de deriva atribuible a que el canal
esta filtrado y a que el enriquecimiento transitorio entra y sale. Un factor
equivocado no da plano; da una recta con pendiente.

POR QUE LA CONTRADICCION DEL AFR NO ERA UN PROBLEMA DE ESCALA — y esta es la
parte que hay que leer antes de fiarse de un canal de MAF en este log. El mismo
calculo aplicado al aire (`Calculated Air Mass Per Cylinder`, tambien confirmado
en mg/cilindro) NO sale plano, y no sale plano de una forma que ninguna escala
puede arreglar:

  tramo de rpm      Mass Air Flow   Mass Air Flow 1   Mass Air Flow 2
    400-1000            0,049            0,098             0,099
   1000-2000            0,058            0,132             0,107
   2000-3000            0,073            0,161             0,135
   3000-4000            0,096            0,201             0,205
   4000-5000            0,111            0,211             0,242
   5000-6000            0,134            0,247             0,294
   6000-7100            0,150            0,274             0,339

El cociente crece por tres en el rango del log. Un factor de escala es una
CONSTANTE: multiplica igual a 400 rpm que a 7 000. Que crezca monotonamente con
el caudal significa que estos canales no miden el aire que el modelo de la ECU
calcula, y que ningun numero puesto aqui los va a hacer coincidir. A 6 715 rpm y
227,2 kPa el modelo pide 1 117 kg/h de aire y `Mass Air Flow` publica 261 kg/h
con este factor: es un sensor que se queda corto, progresivamente, en un motor
que la ECU gobierna por presion de colector (speed-density), no por MAF.

Tampoco es que esten desconectados —la hipotesis (a) de la nota anterior—: los
tres varian con el motor (`Mass Air Flow 1` recorre 60..4 760 crudo, con 1 207
valores distintos), no arrastran un valor por defecto como Oil Temperature.

CONSECUENCIA PARA QUIEN LEA EL LOG. Los cinco canales llevan la unidad correcta
para el tipo, kg/h, y `Fuel Mass Flow` es fiable en valor absoluto. Los cuatro de
aire NO lo son: sirven para ver una tendencia, no para calcular un AFR ni una
potencia. Es un defecto del canal, no de la unidad, y por eso el factor se
confirma y el aviso se queda escrito aqui.

QUE MIRAR SI ESTE NUMERO ESTA MAL. Lo primero, el 0,813875 de arriba: si ese
cociente no es constante en otro log, la identidad se cae y con ella el factor.
Lo segundo, el aviso del MAF: si en otro coche los canales de aire salen planos
contra el modelo, entonces lo de aqui es de este coche y no del formato."""
canales = 5

[tipos.AngularVelocity]
dimension = "angular_speed"
# 1 cuenta = 100 grados/s = 50/3 rpm
a_canonica = 16.666666666666668
confianza = "confirmed"
evidencia = """
RESUELTO EN F1-38. La nota anterior decia que el crudo 402 no guardaba relacion
evidente con 6 715 rpm «en ninguna escala decimal». Si la guarda, y el error
estaba en buscarla sobre UNA FILA: con las 2 636 del AutoLog el canal se
identifica solo.

  correlacion(Angular Velocity, RPM) = +1,00000

No es «parecida a» las rpm: ES las rpm. El canal no aporta una medida nueva, es
el regimen del cigueñal en otra unidad, y eso es lo que permite fijar la escala
sin depender de ninguna suposicion fisica.

LA ESCALA, y es exacta:

  Angular Velocity == parte_entera(RPM x 0,06)   en 2 597 de 2 636 filas (98,5 %)

Las 39 filas que fallan lo hacen por una cuenta y todas en el mismo sitio: donde
RPM x 0,06 queda justo por debajo de un entero (rpm 933 -> 55,98, el canal
publica 56). O sea que la ECU trunca su regimen interno, que no es exactamente el
entero que publica en RPM. Es truncamiento, no otro factor.

QUE DESCARTA EL TRUNCAMIENTO FRENTE A UN FACTOR DISTINTO. Ajustando por minimos
cuadrados sale 0,059890 en vez de 0,060000, un 0,18 % por debajo, y la tentacion
es escribir ese numero. No: el sesgo medido es de -0,478 cuentas y es EL MISMO en
todos los tramos de rpm (-0,476 a 400-1000 rpm, -0,481 a 6000-7100). Un factor
equivocado da un sesgo PROPORCIONAL al valor; un truncamiento da -0,5 cuentas
constante, que es exactamente lo que hay. Con 0,06 exacto las 2 636 filas
coinciden dentro de +-1 cuenta; con 0,059890, tambien, y ademas hay que explicar
por que el sesgo no crece. Se adopta 0,06.

LA UNIDAD. 1 cuenta = 1/0,06 rpm = 50/3 rpm = 16,667 rpm, que son 100 grados por
segundo exactos (100 deg/s = 100/6 rpm). El factor a la canonica del proyecto
—rpm, units.toml— es 50/3; el 16,666666666666668 de arriba es el doble mas
cercano, con un error de 1e-16 que esta catorce ordenes de magnitud por debajo
del 0,18 % de la medida.

RESOLUCION, que es lo unico incomodo de este canal: a ralenti (412 rpm) publica
24 cuentas, asi que un escalon de una cuenta son 16,7 rpm. Para mirar deriva de
ralenti no sirve; hay que usar `RPM`, que es el mismo dato con resolucion de
1 rpm. Merece la pena decirlo en la interfaz antes de que alguien diagnostique un
ralenti inestable que solo es cuantizacion.

QUE MIRAR SI ESTE NUMERO ESTA MAL. La correlacion +1,00000 y el 98,5 % de
coincidencia exacta con la parte entera; si el canal fuese la velocidad angular
de otra cosa (un arbol, una rueda) esas dos cifras no saldrian."""
canales = 1

# =========================================================================== #
#  INFERIDOS — plausibles pero sin identidad que los pruebe.
#  Se muestran con marca visual. Confirmarlos es tarea F1-38.
# =========================================================================== #

[tipos.Time_ms_as_s]
dimension = "time"
a_canonica = 0.001
confianza = "inferred"
evidencia = """
El propio nombre del tipo lo dice: valor en ms, magnitud en s.
Engine Running Time 283376 -> 283,4 s. El log dura 245,1 s, así que el motor
llevaba en marcha ~38 s antes de empezar a registrar: coherente.
Boost Control Delay 737 -> 0,737 s, plausible para un retardo de control."""
canales = 5

[tipos.Time_s]
dimension = "time"
a_canonica = 1.0
confianza = "inferred"
evidencia = """
Accumulated Engine Running Time 967099 -> 268,6 h de motor acumuladas.
Plausible para un vehículo en uso; no hay identidad que lo pruebe."""
canales = 1

[tipos.Time_ms]
dimension = "time"
a_canonica = 0.001
confianza = "inferred"
evidencia = """
Decel Cut Delay Time 2196, DisplayMaxMin 5000,0.
Con x1 ms: retardo de 2,2 s y máximo de 5 s, plausible para un corte en
deceleración. Con /10 saldrían 220 ms y 500 ms, también plausible.
AMBIGUO: solo hay un canal de este tipo y ninguna identidad que lo fije."""
canales = 1

[tipos.Resistance]
dimension = "resistance"
a_canonica = 1.0
confianza = "inferred"
evidencia = """
Synced Pulse Input 1 Resistance 7257 -> 7,26 kΩ, coherente con un divisor con
resistencia de polarización. DisplayMaxMin 2000000,0 = 2 MΩ.
Ojo: el canal 3 vale −2147483639, que es un CENTINELA de sin dato, no una
medida (docs/01 §1.13)."""
canales = 7

[tipos.Flow]
dimension = "volume_flow"
# cc/min -> L/h  ==  1 cc/min * 60/1000
a_canonica = 0.06
confianza = "confirmed"
evidencia = """
CORREGIDO x10 en F1-47. El valor anterior era 0,006, que daba 62 cc/min.

`Injection Stage 1 Flow Rate` vale 620 en crudo y es CONSTANTE en las 2 636
filas del AutoLog: no es una medida, es el inyector configurado en la ECU. El
propietario declara inyectores Bosch EV14 de 640 cc/min, así que el crudo está
en cc/min (620 cc/min, un 3 % por debajo del nominal, que es lo que un tuner
mide o introduce) y no en décimas: 62 cc/min es diez veces menos que cualquier
inyector moderno, y no alimenta los 102 mg de combustible por cilindro que el
propio log registra a plena carga.

POR QUÉ NO SE VIO ANTES. La evidencia anterior cruzaba este tipo con
InjFuelVolume, y los dos estaban desviados x10 EN EL MISMO SENTIDO, así que el
cociente cuadraba y el 7,4 % restante se atribuyó al tiempo muerto. La nota
anterior ya avisaba —«los dos se apoyan mutuamente, ninguno se prueba solo»—;
lo que faltaba era un dato de fuera del log, y ese dato es el inyector.

CONFIRMACIÓN INDEPENDIENTE DEL INYECTOR, por aritmética de motor. `Fuel Flow
Estimated` es de este tipo, y su valor se puede predecir sin usarlo: 102 mg de
combustible por cilindro, 6 cilindros, y a 6 449 rpm un cuatro tiempos inyecta
una vez por cilindro cada dos vueltas.

  6 x 102 mg x 6449/2 ciclos/min = 118,4 kg/h = 159,8 L/h a 0,741 g/mL

y el canal vale 2 699 en crudo:

  con 0,06  (corregido): 161,9 L/h   -> 1,3 % de diferencia
  con 0,006 (anterior):   16,2 L/h   -> diez veces menos

Esta comprobación no usa el caudal del inyector ni el tiempo muerto, así que es
independiente de la identidad de arriba. Y da una potencia implícita de 441 a
529 hp según el consumo específico (0,36 a 0,30 kg/kW·h), coherente con un
RB26DETT a 213 kPa absolutos: un número que el propietario puede juzgar de un
vistazo, que es la clase de evidencia que hace revisable una puerta G1.

AVISO, la única evidencia que apunta en contra: DisplayMaxMin 16000,1 son
16 000 cc/min con este factor, un tope alto para un inyector (con el factor
anterior salían 1 600 cc/min, más parecido a un límite de dimensionado). Se
mantiene la corrección porque un DisplayMaxMin no acota la escala
—`ShortDistance` demuestra que un canal puede excederlo— y porque enfrente hay
tres comprobaciones que concuerdan: la identidad del inyector, la densidad del
combustible y esta."""
canales = 2

[tipos.InjFuelVolume]
dimension = "volume"
# decenas de nanolitros -> litros
a_canonica = 0.00000001
confianza = "confirmed"
evidencia = """
CORREGIDO x10 en F1-47. El valor anterior era 1e-09.

IDENTIDAD ARITMÉTICA EXACTA, y esta vez sí lo es. Restando el tiempo muerto,
que el propio log publica en `Injection Stage 1 Dead Time`:

  caudal x (tiempo de apertura - tiempo muerto) = volumen inyectado

En la fila del máximo de aire por cilindro: 620 cc/min x (14 245 - 925) µs =
137,64 µL, y `Injector 1 Volume` vale 13 764 en crudo. Sobre las 744 filas del
AutoLog con más del 20 % de ciclo de trabajo, el cociente µL/cuenta tiene
mediana 0,009999 y DESVIACIÓN TÍPICA 0,000000, con p5 = 0,009999 y
p95 = 0,010000. No es un ajuste dentro de una tolerancia: es la misma cuenta.

Lo que fija la escala ABSOLUTA, y no solo la relativa, es el tiempo muerto. La
evidencia anterior no lo restaba, y ese 7,4 % que sobraba —despachado como
«atribuible al tiempo muerto»— era exactamente el tiempo muerto. Restarlo
cierra la identidad al quinto dígito y deja al descubierto el factor 10.

COMPROBACIÓN INDEPENDIENTE, la que decide. La densidad del combustible que sale
de dividir `Fuel Mass Per Cylinder` entre este volumen:

  con 1e-09 (lo anterior):  7,412 g/mL  -> la densidad del ACERO
  con 1e-08 (lo corregido): 0,741 g/mL  -> gasolina (0,72-0,775)

sobre las mismas 744 filas, con desviación típica 0,007 y p5-p95 de 0,726 a
0,747. Un combustible de 7,4 g/mL no existe. No lo señalaba nada porque nadie
mira la densidad, y los 13 canales de volumen inyectado se venían mostrando
diez veces pequeños sin que ninguna cifra pareciese rara.

DisplayMaxMin 100000,0 son 1 mL con este factor, coherente con un inyector
grande a bajo régimen."""
canales = 13

[tipos.EngineVolume]
dimension = "volume"
a_canonica = 0.001
confianza = "inferred"
# El nombre del tipo engaña: su único canal es volumen de COMBUSTIBLE, no
# cilindrada.
evidencia = """
Total Fuel Used Since Engine Startup 754 -> 0,754 L consumidos.
En 283 s de motor con varias tiradas a plena carga es plausible.
DisplayMaxMin 4000,0 -> 4 L."""
