# =========================================================================== #
#  PRESETS (docs/06 §6.9)
#  Cubren «tuner estadounidense que quiere psi, °F y AFR de un clic».
#  El usuario puede definir los suyos; estos son los de fábrica.
# =========================================================================== #
[presets.si]
etiqueta = "SI puro"
temperature = "K"
pressure = "kPa"
pressure_referencia = "ninguna"
speed = "m/s"
mixture_ratio = "lambda"
volume = "L"
distance = "m"
time = "s"
ratio = "fraccion"

[presets.metrico]
etiqueta = "Métrico"
por_omision = true
temperature = "degC"
pressure = "bar"
pressure_referencia = "auto"
speed = "km/h"
mixture_ratio = "lambda"
volume = "L"
distance = "km"
time = "ms"
ratio = "pct"

[presets.imperial]
etiqueta = "Imperial"
temperature = "degF"
pressure = "psi"
pressure_referencia = "auto"
speed = "mph"
mixture_ratio = "afr"
volume = "gal"
distance = "mi"
time = "ms"
ratio = "pct"

[presets.motorsport_eu]
etiqueta = "Motorsport EU"
temperature = "degC"
pressure = "bar"
pressure_referencia = "auto"
speed = "km/h"
mixture_ratio = "lambda"
volume = "L"
distance = "km"
time = "ms"
ratio = "pct"
angle = "deg"

[presets.motorsport_us]
etiqueta = "Motorsport US"
temperature = "degF"
pressure = "psi"
pressure_referencia = "auto"
speed = "mph"
mixture_ratio = "afr"
volume = "gal"
distance = "mi"
time = "ms"
ratio = "pct"
angle = "deg"

# =========================================================================== #
#  CENTINELAS DE «SIN DATO» / SATURACIÓN (docs/01 §1.13)
#  Observados repetidamente en el AutoLog real.  NO son medidas: si se
#  promedian, contaminan cualquier estadística.  Se tratan como valor ausente.
# =========================================================================== #
[centinelas]
i32 = [2147483647, -2147483648, -2147483645, -2147483628, -2147483639, 8388607, 8388608]
# Cadenas que un CSV genérico puede traer como «sin dato» (docs/07 §7.10).
texto = ["", "NaN", "nan", "inf", "-inf", "#N/A", "N/A", "n/a", "NULL", "null", "---", "-"]

# =========================================================================== #
#  CLASES DE MAGNITUD (docs/06 §6.5)
#  Declarativo, para que el motor no pueda «olvidarse» de la regla.
#  Toda métrica del sistema debe declarar una de estas clases.
# =========================================================================== #
[clases.punto]
descripcion = "Valor absoluto: aplica a y b."
usa_desplazamiento = true
ejemplos = ["valor bajo el cursor", "media", "minimo", "maximo", "percentil", "umbral"]

[clases.intervalo]
descripcion = "Diferencia: aplica solo a. Un Δ de 10 K son 10 °C y 18 °F."
usa_desplazamiento = false
ejemplos = ["delta del doble cursor", "rango", "desviacion tipica", "RMS", "pico a pico"]

[clases.tasa]
descripcion = "Cociente: parte lineal del numerador entre la unidad del denominador."
usa_desplazamiento = false
ejemplos = ["derivada", "pendiente"]

[clases.varianza]
descripcion = "Cuadrática: aplica a al cuadrado."
usa_desplazamiento = false
factor_al_cuadrado = true
ejemplos = ["varianza"]
