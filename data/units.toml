#  DataLogViewer — catálogo de dimensiones y unidades
#
#  Tarea F0-08.  Especificación: docs/06-sistema-de-unidades.md
#  PUERTA G1: los factores de este fichero llegan a decisiones de tuning.
#  Ninguna entrada se cambia sin que una persona lea el diff.
#
#  MODELO (docs/06 §6.3)
#      entero crudo --escala de origen--> VALOR CANÓNICO --desde_canonica--> mostrado
#
#  La escala de origen NO está aquí: vive en data/formats/<formato>.toml (F0-09),
#  porque depende del fabricante.  Aquí solo está canónica -> mostrada.
#
#  `desde_canonica` es la conversión que aplica el renderizador:
#      tipo = "afin"          y = a*x + b
#      tipo = "reciproca"     y = a/x
#      tipo = "parametrizada" y = a(p)*x, con `p` tomado de un canal del log
#
#  SEMÁNTICA DE PUNTO / INTERVALO (docs/06 §6.5) — la trampa principal
#      Un valor absoluto usa `a` y `b`.  Una DIFERENCIA usa solo `a`.
#      Por eso un Δ de 10 K son 10 °C y 18 °F, no −263,15 °C.
#      Las unidades con b != 0 están marcadas con `origen_desplazado = true`
#      para que el motor no pueda ignorarlo por descuido.

[meta]
version = 1
especificacion = "docs/06-sistema-de-unidades.md"
tarea = "F0-08"

# =========================================================================== #
#  TEMPERATURA — canónica: kelvin
#  Los logs Haltech traen deciKelvin (§1.8), de ahí que la canónica sea K.
# =========================================================================== #
[dimensiones.temperature]
canonica = "K"
etiqueta = "Temperatura"

[dimensiones.temperature.unidades.K]
etiqueta = "K"
desde_canonica = { tipo = "afin", a = 1.0, b = 0.0 }
decimales = 1

[dimensiones.temperature.unidades.degC]
etiqueta = "°C"
desde_canonica = { tipo = "afin", a = 1.0, b = -273.15 }
decimales = 1
origen_desplazado = true

[dimensiones.temperature.unidades.degF]
etiqueta = "°F"
desde_canonica = { tipo = "afin", a = 1.8, b = -459.67 }
decimales = 1
origen_desplazado = true

[dimensiones.temperature.unidades.degR]
etiqueta = "°R"
desde_canonica = { tipo = "afin", a = 1.8, b = 0.0 }
decimales = 1

# =========================================================================== #
#  PRESIÓN — canónica: kPa ABSOLUTOS
#  Absoluto/relativo NO es una unidad: es un cambio de origen (docs/06 §6.6),
#  combinable con cualquier unidad de aquí.  Ver [presion_referencia].
# =========================================================================== #
[dimensiones.pressure]
canonica = "kPa"
etiqueta = "Presión"
admite_referencia = true

[dimensiones.pressure.unidades.kPa]
etiqueta = "kPa"
desde_canonica = { tipo = "afin", a = 1.0, b = 0.0 }
decimales = 0

[dimensiones.pressure.unidades.hPa]
etiqueta = "hPa"
alias = ["mbar"]
desde_canonica = { tipo = "afin", a = 10.0, b = 0.0 }
decimales = 0

[dimensiones.pressure.unidades.bar]
etiqueta = "bar"
desde_canonica = { tipo = "afin", a = 0.01, b = 0.0 }
decimales = 2

[dimensiones.pressure.unidades.psi]
etiqueta = "psi"
desde_canonica = { tipo = "afin", a = 0.1450377377, b = 0.0 }
decimales = 1

[dimensiones.pressure.unidades.atm]
etiqueta = "atm"
desde_canonica = { tipo = "afin", a = 0.009869232667, b = 0.0 }
decimales = 3

[dimensiones.pressure.unidades.inHg]
etiqueta = "inHg"
desde_canonica = { tipo = "afin", a = 0.2952998751, b = 0.0 }
decimales = 2

[dimensiones.pressure.unidades.mmHg]
etiqueta = "mmHg"
alias = ["Torr"]
desde_canonica = { tipo = "afin", a = 7.500615613, b = 0.0 }
decimales = 1

# Modos de referencia para pasar de absoluto a relativo.
# El valor de referencia se resta ANTES de la conversión de unidad, y solo a
# los valores de clase «punto», nunca a las diferencias.
[presion_referencia]
modos = ["ninguna", "constante", "canal", "auto"]
constante_por_omision_kPa = 101.325
# `auto`: mediana de la presión de colector con el motor parado al inicio del log.
auto_rol = "manifold_pressure"
auto_condicion = "engine_speed == 0"
# No hay canal barométrico en los logs de muestra (docs/01 §1.9): si se usa la
# constante, la interfaz debe marcar la presión relativa como estimada.
nota = "docs/01-formato-log.md §1.9"

# =========================================================================== #
#  RELACIÓN DE MEZCLA — canónica: lambda
#  El tipo Haltech se llama «AFR» pero contiene lambda (docs/01 §1.8).
# =========================================================================== #
[dimensiones.mixture_ratio]
canonica = "lambda"
etiqueta = "Mezcla"

[dimensiones.mixture_ratio.unidades.lambda]
etiqueta = "λ"
desde_canonica = { tipo = "afin", a = 1.0, b = 0.0 }
decimales = 3

# AFR real: usa la estequiometría del PROPIO log, no 14,7 cableado.
# Sin esto, cualquier log de E85 o metanol saldría mal.
[dimensiones.mixture_ratio.unidades.afr]
etiqueta = "AFR"
desde_canonica = { tipo = "parametrizada", parametro_rol = "stoichiometry", a_por_omision = 14.7 }
decimales = 2

[dimensiones.mixture_ratio.unidades.afr_gasolina]
etiqueta = "AFR (gasolina)"
desde_canonica = { tipo = "afin", a = 14.7, b = 0.0 }
decimales = 2

# Relación de equivalencia: phi = 1/lambda.  Conversión recíproca.
[dimensiones.mixture_ratio.unidades.phi]
etiqueta = "φ"
desde_canonica = { tipo = "reciproca", a = 1.0 }
decimales = 3

