# DataLogViewer — Catálogo de canales enumerados (enums)
#
# Tarea F0-11. Especificación: docs/01-formato-log.md §1.10
#
# Este archivo contiene los 75 canales candidatos a enumeración
# (Type: Raw con rango ≤ 20) más las 2 máscaras de bits especiales:
# Engine Protection Cause (0…65535) y Trigger System Errors (0…31).
#
# IMPORTANTE: Los códigos están SIN TRADUCIR a propósito. La asignación
# código → nombre requiere documentación del fabricante (tarea F3-15).
# Hasta entonces, los códigos desconocidos se muestran como «Estado N».
#
# Los canales bitmask (Protection Cause, Trigger Errors) no son líneas
# continuas: se decodifican bit a bit y se dibujan como carriles apilados.
#

