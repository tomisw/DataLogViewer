# =========================================================================== #
#  REFERENCIA DE PRESIÓN  ·  cambio de ORIGEN, no de unidad (docs/06 §6.6)
# =========================================================================== #
#  `referencia_kpa` se resta a los PUNTOS y no a los intervalos. Se comprueba
#  aquí y no en [[punto]] porque es la combinación —origen y unidad a la vez— lo
#  que hay que fijar: cualquier unidad de presión debe poder ser relativa.

[[referencia]]
caso = "MAP máxima del AutoLog real como boost en bar"
unidad = "bar"
canonica = 227.2
referencia_kpa = 101.325
clase = "punto"
esperado = 1.258750
tolerancia = 1e-6
origen = "227,2 − 101,325 = 125,875 kPa de boost. Es el número que un tuner reconoce del log; los 2,272 bar absolutos de la misma fila no le dicen nada"

[[referencia]]
caso = "la misma fila en psi de boost"
unidad = "psi"
canonica = 227.2
referencia_kpa = 101.325
clase = "punto"
esperado = 18.2566252
tolerancia = 1e-6
origen = "125 875 Pa ÷ 6 894,757 293 Pa/psi = 18,256 625 psi. «18 psi» es como se describe esta puesta a punto. Este valor se comprobó desde la definición del psi, no desde el catálogo: la primera versión de esta fila decía 18,2555 y la prueba la cazó"

[[referencia]]
caso = "presión atmosférica es cero boost"
unidad = "bar"
canonica = 101.325
referencia_kpa = 101.325
clase = "punto"
esperado = 0.0
tolerancia = 1e-12
origen = "por construcción, y es la comprobación de que el origen se resta antes de escalar y no después"

[[referencia]]
caso = "una diferencia de presión NO cambia al pasar a relativa"
unidad = "bar"
canonica = 50.0
referencia_kpa = 101.325
clase = "intervalo"
esperado = 0.5
tolerancia = 0.0
origen = "docs/06 §6.6: al pasar a relativo la conversión de un punto resta la referencia; la de un intervalo no. Si se restara, un Δ de 50 kPa se mostraría como −0,51 bar"

# =========================================================================== #
#  ERRORES DE USO  ·  lo que el motor tiene que RECHAZAR
# =========================================================================== #
#  Un valor aproximado y equivocado es peor que un error: el usuario no tiene
#  forma de saber que lo que ve no significa lo que cree.

[[rechazo]]
caso = "diferencia en una conversión recíproca"
dimension = "mixture_ratio"
unidad = "phi"
clase = "intervalo"
motivo = "φ = 1/λ no es lineal: la diferencia de dos φ no es el φ de la diferencia"

[[rechazo]]
caso = "varianza en una conversión recíproca"
dimension = "mixture_ratio"
unidad = "phi"
clase = "varianza"
motivo = "por lo mismo, y con el error elevado al cuadrado"

[[rechazo]]
caso = "referencia de origen en una dimensión que no es presión"
dimension = "temperature"
unidad = "degC"
clase = "punto"
referencia_kpa = 101.325
motivo = "solo la presión admite cambio de origen (docs/06 §6.6). Restar kPa a un kelvin no significa nada"

[[rechazo]]
caso = "unidad que no pertenece a la dimensión"
dimension = "temperature"
unidad = "bar"
clase = "punto"
motivo = "el selector de unidad nunca debe ofrecer una unidad de otra dimensión, y si un perfil guardado la trae, hay que enterarse"
