# =========================================================================== #
#  DELTAS  ·  solo la parte lineal `a·x`.  LA PRUEBA CENTRAL DE F1-20
# =========================================================================== #
#  Nótese que `unidad` y `canonica` repiten combinaciones de la sección [[punto]]
#  con resultados distintos. Es el objeto de la prueba: la misma unidad y el mismo
#  número deben dar cosas distintas según la clase.

[[delta]]
caso = "el caso canónico: diez kelvin de diferencia en Celsius"
dimension = "temperature"
unidad = "degC"
canonica = 10.0
esperado = 10.0
tolerancia = 0.0
origen = "docs/06 §6.12. Como PUNTO daría −263,15: 27 000 % de error y con aspecto de temperatura razonable en algún otro contexto"

[[delta]]
caso = "el caso canónico: diez kelvin de diferencia en Fahrenheit"
dimension = "temperature"
unidad = "degF"
canonica = 10.0
esperado = 18.0
tolerancia = 1e-9
origen = "docs/06 §6.12. Solo la pendiente: 10 × 1,8. Como PUNTO daría −441,67"

[[delta]]
caso = "desviación típica de temperatura"
dimension = "temperature"
unidad = "degC"
canonica = 2.0
esperado = 2.0
tolerancia = 0.0
origen = "docs/06 §6.5: la desviación típica es un intervalo. Como punto saldría −271,15 °C, que es el síntoma clásico de este defecto"

