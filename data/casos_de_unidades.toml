#  DataLogViewer — tabla de casos conocidos de conversión de unidades
#
#  Tarea F1-20.  Especificación: docs/06-sistema-de-unidades.md §6.5 y §6.12.
#  PUERTA G1: cada número de este fichero es una afirmación sobre física o sobre
#  una definición de unidad. No se cambia una entrada sin que una persona la
#  compruebe contra la fuente citada en `origen`.
#
#  PARA QUÉ SIRVE ESTE FICHERO
#  ==========================
#  Es la red del subsistema de unidades. `dlv-core/tests/test_trampa_del_delta.py`
#  recorre estas entradas y comprueba que el motor las reproduce. La tabla está en
#  `data/` y no dentro de la prueba por dos razones:
#
#    1. Se puede revisar sin leer Python. Un tuner puede auditar la columna de
#       valores esperados; nadie va a auditar aserciones enterradas en un fichero
#       de pruebas.
#    2. Añadir un caso conocido no es escribir código. Cuando aparezca una unidad
#       nueva o una discrepancia con otra herramienta, la reacción correcta es
#       añadir una fila aquí, no una función.
#
#  LA TRAMPA DEL DELTA
#  ===================
#  El fallo más caro de todo el subsistema es aplicar el desplazamiento de origen
#  a una diferencia. Un Δ de 10 K son 10 °C y 18 °F, nunca −263,15 °C. La sección
#  [[delta]] es la que lo fija, y es deliberadamente redundante con [[punto]]:
#  cada temperatura aparece como punto y como intervalo, porque lo que importa no
#  es que cada una salga bien por separado, sino que la MISMA unidad dé resultados
#  distintos según la clase.
#
#  UNIDADES
#  ========
#  `canonica` está siempre en la unidad canónica de la dimensión (data/units.toml):
#  kelvin, kPa absolutos, lambda, fracción, rpm, km/h, grados, voltios, segundos.
#  `esperado` está en la unidad de `unidad`.
#
#  `tolerancia` es absoluta, en la unidad de `esperado`. Donde la conversión es
#  exacta en binario (×1, ×100, ×0,01) se pone 0,0 a propósito: cualquier
#  desviación sería un defecto, no ruido de coma flotante.

[meta]
version = 1
tarea = "F1-20"
especificacion = "docs/06-sistema-de-unidades.md §6.5 y §6.12"
unidades = "`canonica` en unidad canónica; `esperado` en la unidad indicada"

# =========================================================================== #
#  PUNTOS  ·  se aplica la conversión afín completa `a·x + b`
# =========================================================================== #

