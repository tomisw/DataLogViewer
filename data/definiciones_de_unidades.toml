# =========================================================================== #
#  CONSUMO  ·  canónica L/100 km, y las recíprocas
# =========================================================================== #
#  Las tres son recíprocas: el consumo y el rendimiento van al revés. Un
#  intervalo de L/100 km NO se puede convertir a mpg, y el motor lo rechaza en
#  vez de dar un número aproximado (data/casos_de_unidades.toml, sección
#  [[rechazo]]).

[[definicion]]
dimension = "fuel_economy"
unidad = "km/L"
reciproca = 100
derivacion = "L/100 km = 100 ÷ (km/L)"
origen = "definición: son la misma magnitud invertida, con el factor 100 del «por 100 km»"

[[definicion]]
dimension = "fuel_economy"
unidad = "mpg_us"
reciproca = { escala = 23100000000, constantes = [
  ["pulgada_en_m", 3],
  ["milla_en_m", -1],
] }
derivacion = "100 × 3,785 411 784 L/gal ÷ 1,609 344 km/mi = 235,214 583 3. La escala 2,31 × 10¹⁰ es 100 (del «por 100 km») × 231 (in³ del galón) × 1 000 (m³ a L) × 1 000 (m a km)"
origen = "definición del galón US y de la milla"

[[definicion]]
dimension = "fuel_economy"
unidad = "mpg_uk"
reciproca = { escala = 100000, constantes = [
  ["galon_uk_en_L", 1],
  ["milla_en_m", -1],
] }
derivacion = "100 × 4,546 09 L/gal ÷ 1,609 344 km/mi = 282,480 936 3"
origen = "Weights and Measures Act 1985: 1 gal imperial ≡ 4,546 09 L"

# =========================================================================== #
#  PAR Y POTENCIA  ·  canónicas Nm y kW
# =========================================================================== #
#  Los dos caballos son distintos y se parecen en un 1,4 %: `hp` es mecánico
#  (550 ft·lbf/s) y `PS` es métrico (75 kgf·m/s). Confundirlos son 4 CV en un
#  motor de 300, que es justo el orden de magnitud de lo que la gente discute.

[[definicion]]
dimension = "torque"
unidad = "lbft"
canonicas_por_unidad = { constantes = [
  ["libra_en_kg", 1],
  ["gravedad_estandar_m_s2", 1],
  ["pie_en_m", 1],
] }
derivacion = "1 lb·ft = 0,453 592 37 kg × 9,806 65 m/s² × 0,3048 m = 1,355 817 948 Nm"
origen = "NIST SP 811: 1 lbf·ft = 1,355 817 948 331 4 N·m exactos"

[[definicion]]
dimension = "torque"
unidad = "kgfm"
canonicas_por_unidad = { constantes = [["gravedad_estandar_m_s2", 1]] }
derivacion = "1 kgf·m = 1 kg × 9,806 65 m/s² × 1 m = 9,806 65 Nm"
origen = "definición del kilogramo-fuerza con g_n"

[[definicion]]
dimension = "power"
unidad = "hp"
canonicas_por_unidad = { escala = [550, 1000], constantes = [
  ["libra_en_kg", 1],
  ["gravedad_estandar_m_s2", 1],
  ["pie_en_m", 1],
] }
derivacion = "1 hp = 550 ft·lbf/s = 550 × 1,355 817 948 W = 745,699 871 6 W = 0,745 699 871 6 kW"
